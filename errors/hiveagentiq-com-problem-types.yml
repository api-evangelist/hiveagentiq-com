summary: >-
  The four contracts declare exactly one error response each, "402 Payment required — x402 or MPP", with no schema.
  The live services use at least four different error envelopes, none of them application/problem+json: a 401
  "unregistered_agent" recruitment envelope (HiveTrust, HiveBank), a 402 "HIVE_402" payment envelope (HiveGate), a 404
  "not_found" envelope with recovery_actions (HiveGate) and a 404 {"success":false,"error":"Not Found"} listing every
  valid endpoint (HiveLaw). Two hosts also answer HTTP 200 for paths that do not exist — HiveTrust with a "not a real
  endpoint" JSON body and HiveBank with an "unknown path" hint — so on those hosts a 200 is not proof the route exists
  and an agent must read the body. Every envelope carries a "recruitment" block with onboarding links and brand
  metadata.
