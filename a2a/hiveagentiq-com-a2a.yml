conformance:
  spec: A2A 1.0.0
  grade: near-conformant
  protocol_version: '0.3.0'
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    All three hard checks pass: capabilities is an OBJECT (streaming, pushNotifications, stateTransitionHistory, all
    false), protocolVersion is present ("0.3.0") and skills is an ARRAY of five populated skills (id, name, description,
    tags, inputModes, outputModes, examples). preferredTransport is absent, so a 0.3.0 reader cannot tell whether the
    declared url speaks JSONRPC, GRPC or HTTP+JSON — and in practice it speaks none (see corroborating_probes). That
    missing optional discriminator places the card at near-conformant rather than conformant.
  deviations:
  - field: preferredTransport
    observed: absent
    note: Required-by-convention in 0.3.0 for a card with a top-level url; no additionalInterfaces either.
  - field: url
    observed: https://hivetrust.hiveagentiq.com (root)
    note: 'Not an A2A endpoint: JSON-RPC POSTs to / and /a2a receive the host''s catch-all "not a real endpoint" 200 body.'
  - field: securitySchemes / security
    observed: 'absent; a vendor "authentication": {"schemes": ["x402","api-key"]} object instead'
    note: The A2A field for declaring auth is not used, so a conformant client sees no auth requirement while the provider gates every write on a DID and payment.
  - field: skills[].examples
    observed: empty arrays on all five skills
  - field: top-level vendor fields
    observed: pillars, genesis_program, citizen_mode, capability_vcs, authentication, payment, bogo, standards, cheqd_compatible, vcdm_version, did_method, cryptosuite, trust_registry, did_configuration, zk_infrastructure, extensions
    note: 'Roughly 70% of the document''s bytes are outside the AgentCard schema; the "extensions" object is not the A2A capabilities.extensions[] shape.'
  - field: documentationUrl / iconUrl / signatures
    observed: absent
