surface_relationship:
  note: >-
    Hive Agent IQ publishes three agent surfaces per service and they are projections of route sets that no single
    document fully describes. A2A: four 0.3.0 cards (17 skills in total) of which exactly one url (HiveGate) answers
    A2A JSON-RPC. MCP: three live Streamable-HTTP servers (26 tools) with anonymous tools/list plus HiveLaw's REST-listed
    four; see mcp/hiveagentiq-com-mcp.yml. REST: four thin OpenAPIs (24 operations) beside discovery documents naming
    ~150 routes; see mcp/hiveagentiq-com-tool-crosswalk.yml. The company's fifth listed agent surface, the apex
    hiveagentiq.com, is down.
