- aid: hiveagentiq-com:hivelaw-legal-compliance-api
  name: HiveLaw AI Legal Contracts & Compliance API
  description: >-
    Legal and compliance layer on hivelaw.hiveagentiq.com: contract drafting, AI review and on-chain sealing ($0.50
    each) and three compliance-tier programmes ($500, $1,500, $2,500) in the served 6-operation OpenAPI 3.0.3, with
    disputes, appeals, jurisdiction data (free GET /v1/jurisdictions), a 555-case precedent corpus, EU AI Act
    hallucination audits, compliance stamps and a Bronze/Silver/Gold Seal of Compliance ($100-$1,000/year) listed in
    /.well-known/hivelaw.json and priced in /.well-known/hive-payments.json. Four MCP-shaped tools are published over
    REST (GET /v1/mcp/tools, POST /v1/mcp/call); POST /mcp is a real 404, so no MCP client can connect. Unknown paths
    return a genuine 404 that doubles as the endpoint catalogue.
  humanURL: https://hivelaw.hiveagentiq.com/.well-known/hivelaw.json
  baseURL: https://hivelaw.hiveagentiq.com
