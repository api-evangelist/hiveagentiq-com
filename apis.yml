apis:
- aid: hiveagentiq-com:hivetrust-kya-identity-trust-api
  name: HiveTrust KYA Identity & Trust API
  description: >-
    Identity and trust substrate for AI agents on hivetrust.hiveagentiq.com: DID issuance ($1.00 USDC), W3C VC and
    scoped HiveCredential issue/verify/scope ($0.01-$0.50), trust-score lookup ($0.10; a free unauthenticated
    /v1/trust/lookup/{did} also answers), identity passport and reputation proof, plus data-oracle leases, USDC bonds,
    insurance, disputes and an agent liquidation market documented in the /.well-known/hivetrust.json discovery
    document. The served OpenAPI 3.0.3 is an 8-operation stub (no schemas, no operationIds, no securitySchemes) with an
    x-mpp payment extension; authentication is a Hive DID (X-API-Key, Bearer did:hive:* or X-Hive-DID) plus x402 or
    MPP payment per call. Every response carries X-RateLimit-* (100/hour) and Ed25519 provenance headers. The host
    answers HTTP 200 with a "not a real endpoint" JSON body for unknown paths.
  humanURL: https://github.com/srotzin/hivetrust#api-reference
  baseURL: https://hivetrust.hiveagentiq.com
