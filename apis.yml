aid: hiveagentiq-com
name: Hive Agent IQ
description: >-
  Hive Agent IQ (hiveagentiq.com) is the agent-platform brand of Hive Civilization — a single-founder Wyoming company
  (Stephen Rotzin) whose sibling brand thehiveryiq.com is profiled separately — running a federation of agent-facing
  microservices on its own subdomains for autonomous AI agents: HiveTrust (KYA identity, W3C DIDs and verifiable
  credentials, 0-1000 behavioural trust scoring, USDC performance bonds, data-oracle context leases, insurance and
  disputes), HiveGate (free first-DID onboarding, adapters for LangChain, CrewAI, AutoGen, OpenAI, Anthropic and A2A
  agents, trust bridging), HiveBank (treasury attestation, USDC vaults and payment streams) and HiveLaw (contract
  drafting, dispute arbitration, EU AI Act hallucination audits and compliance seals). Each service publishes an
  OpenAPI 3.0.3 document, an A2A 0.3.0 agent card, an ai-plugin.json manifest and, on three of the four, a remote MCP
  server whose tools/list answers anonymously; every metered operation is priced in USDC and settled per call through
  x402 (or the MPP rail) on Base, with responses Ed25519-signed by the service DID. The apex website hiveagentiq.com,
  its legal pages and the HiveForge host returned Cloudflare Error 1000 ("DNS points to prohibited IP", HTTP 403) for
  every path throughout the 2026-09-19 profiling pass.
