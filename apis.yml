- aid: hiveagentiq-com:hivegate-admission-identity-api
  name: HiveGate Admission, Identity & Pricing Tier API
  description: >-
    Onboarding gateway for the Hive network on hivegate.hiveagentiq.com: POST /v1/gate/onboard mints the first
    did:hive DID and API key free, guest registration ($4.99) bridges agents from LangChain, CrewAI, AutoGen, OpenAI,
    Anthropic and A2A with an hgate_* token, and admission, tier verification and upgrades are metered at $0.10-$1.00.
    A 5-operation OpenAPI 3.0.3 stub sits beside a 25-route discovery document (/.well-known/hivegate.json), a real
    llms.txt guide, and a remote MCP server (serverInfo "hive-civilization", 4 tools) that the provider's SDK config
    names as its canonical MCP endpoint. The host root is also a live A2A JSON-RPC responder. Unauthenticated metered
    calls return a 402 HIVE_402 envelope with the USDC amount and rails; unknown /.well-known paths return a real 404.
  humanURL: https://hivegate.hiveagentiq.com/llms.txt
  baseURL: https://hivegate.hiveagentiq.com
