- aid: hiveagentiq-com:hivebank-treasury-api
  name: HiveBank Treasury Attestation & Settlement API
  description: >-
    Agent treasury layer on hivebank.hiveagentiq.com: the served OpenAPI 3.0.3 covers custody and treasury-policy
    attestation ($0.25) and instant, scheduled and credit-line draws ($1.00), while the root discovery document and
    llms.txt describe USDC vaults, yield routing (Aave, Morpho, Spark, Compound on Base), payment streams, budgets and
    cashback that the 5-tool remote MCP server exposes. The provider states it never custodies funds. Any POST to the
    host without payment returns a real x402 v1 PaymentRequirements payload ($0.01, Base USDC, EIP-3009). The OpenAPI
    and agent card still name the hivebank.onrender.com origin the first-party host CNAMEs to; unknown paths answer a
    200 "unknown path" hint body.
  humanURL: https://hivebank.hiveagentiq.com/llms.txt
  baseURL: https://hivebank.hiveagentiq.com
