  name: W3C Decentralized Identifiers (DID) v1.0
  conforms: true
  evidence: 'did:key issuer in did-configuration.json; agent cards standards.w3c_did_core true and did_method "did:key"; hivetrust.json compliance ["W3C-DID", …]; hivetrust_register_agent returns a DID; a proprietary did:hive:* method is used for service issuers (X-Hive-Prov-Iss: did:hive:hivetrust) and for agents (Bearer did:hive:*).'
- id: w3c-vc-data-model-2.0
  name: W3C Verifiable Credentials Data Model 2.0
  conforms: true
  evidence: '@context https://www.w3.org/ns/credentials/v2 in the domain-linkage credential; agent cards vcdm_version "2.0"; card capability_vcs.credential_type "HiveCapabilityCredential"; POST /v1/trust/vc/issue ("Per Verifiable Credential issued (VCDM 2.0)").'
- id: ed25519-signature-2020
  name: Ed25519Signature2020 data-integrity cryptosuite
  conforms: true
  verification: partial
  evidence: 'proof.type Ed25519Signature2020 in did-configuration.json; agent card cryptosuite "Ed25519Signature2020"; per-response Ed25519 provenance headers with a published key at /v1/prov/pubkey. The domain-linkage proofValue is a placeholder, so only the response-header signatures were observed as real signatures.'
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  evidence: >-
    Four agent cards declaring protocolVersion 0.3.0 at /.well-known/agent-card.json on hivetrust, hivegate, hivebank
    and hivelaw .hiveagentiq.com (each graded near-conformant in a2a/hiveagentiq-com-a2a.yml — capabilities object,
    skills array, protocolVersion present, no preferredTransport). POST https://hivegate.hiveagentiq.com/ tasks/get
    returned {"jsonrpc":"2.0","id":1,"error":{"code":-32001,"message":"Task apievangelist-nonexistent-probe not found"}}
    — the A2A-defined TaskNotFoundError — so the HiveGate card's url is a live A2A responder. The HiveTrust card's url
    answers the catch-all 200 body to JSON-RPC; the HiveBank card's url answers an x402 402.
- id: mcp
