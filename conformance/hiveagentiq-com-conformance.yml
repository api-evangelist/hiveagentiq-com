- id: x402
  name: x402 HTTP payment protocol
  version: '1 (x402Version)'
  conforms: true
  verification: observed
  evidence: >-
    POST https://hivebank.hiveagentiq.com/ (no payment) -> HTTP 200 body {"code":"PAYMENT_REQUIRED","protocol":"x402",
