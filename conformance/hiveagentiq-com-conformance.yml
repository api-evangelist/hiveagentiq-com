  version: '2024-11-05'
  conforms: true
  evidence: 'initialize on hivetrust, hivegate and hivebank /mcp returned protocolVersion "2024-11-05" with serverInfo {hivetrust 1.0.0}, {hive-civilization 1.0.0}, {hivebank 1.0.0}; anonymous tools/list returned 17, 4 and 5 tools with inputSchema and annotations (readOnlyHint/destructiveHint/idempotentHint). resources/list and prompts/list return -32601. HiveLaw exposes its 4 tools over REST (GET /v1/mcp/tools) rather than JSON-RPC.'
