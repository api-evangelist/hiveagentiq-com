summary: >-
  Hive Agent IQ's conformance profile is the decentralized-identity and agent-commerce protocol stack, not an
  enterprise or sector standard: W3C DID Core (did:key, plus a proprietary did:hive method), W3C Verifiable Credentials
  Data Model 2.0 with Ed25519Signature2020, a DIF Well Known DID Configuration document served at the RFC 8615 path,
  A2A 0.3.0 agent cards on four hosts (one of them backed by a live JSON-RPC responder), MCP 2024-11-05 on three hosts,
  x402 v1 payment challenges (a real PaymentRequirements payload was observed on HiveBank) and an MPP/Tempo rail
  declared in every contract, plus the CTEF v0.3.1 trust-evidence fixture. It declares no OAuth 2.0, no OIDC, no
  RFC 9728, no RFC 9457, no RFC 9116 security.txt and no RFC 9727 API catalog on any host. Regulatory names in the
  responses (HIPAA, SOC 2, GDPR, EU AI Act, NIST AI RMF) are self-descriptions with no certificate or report behind
  them and are recorded as claimed, not verified.
standards:
- id: did-configuration
  name: DIF Well Known DID Configuration (domain linkage)
  version: v0.0.1 (as stated in the document)
  conforms: true
  domain_standard_signature: true
  evidence: >-
    GET https://hivetrust.hiveagentiq.com/.well-known/did-configuration.json -> 200 application/json with @context
    https://identity.foundation/.well-known/did-configuration/v1, linked_dids[0].type ["VerifiableCredential",
    "DomainLinkageCredential"], issuer did:key:z6MkrkfpCsS21cKrktK7HXy6zyKruDciNLkE58BdfVXVotVH, credentialSubject.origin
    https://hivetrust.hiveagentiq.com, proof.type Ed25519Signature2020. Saved verbatim to
    well-known/hiveagentiq-com-hivetrust-did-configuration.json.
  caveat: >-
    proof.proofValue is the literal string "domain-linkage-proof-placeholder" and validFrom is stamped with the request
    time, so the document has the standard's SHAPE but its linkage credential cannot be cryptographically verified. The
    signature is recorded because the contract declares the standard at the standard's own path; the placeholder proof
    is recorded so nobody credits a verified linkage.
