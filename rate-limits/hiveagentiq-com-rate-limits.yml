summary: >-
  HiveTrust and HiveLaw return X-RateLimit-Limit / X-RateLimit-Remaining / X-RateLimit-Reset on every response,
  authenticated or not: a limit of 100 with a reset expressed in epoch MILLISECONDS on the hour boundary (observed
  1789869600000 then 1789873200000, 3600 s apart), so the window is one hour per client. Retry-After is named in
  Access-Control-Expose-Headers on HiveTrust alongside X-Payment-* and X-HiveTrust-Challenge, so the exhaustion signal
  is declared even though a 429 was not provoked. HiveGate and HiveBank returned no rate-limit headers on any probed
  response. Per-endpoint quotas the provider publishes in prose are listed below; nothing here is documented in the
  OpenAPIs.
