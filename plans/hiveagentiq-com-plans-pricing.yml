  https://www.thehiveryiq.com/pricing (the sibling brand, profiled in all/thehiveryiq-com).
summary: >-
  Sixteen priced tiers/products were read from the provider's own JSON on 2026-09-19: four USDC subscription tiers
  on the HiveTrust document (Citizen Pass $49 one-time / Pro Operator $149 mo / Enterprise Operator $999 mo / Fleet
  Commander $4,999 mo) and twelve Stripe-billed USD products on the HiveGate document (Sovereign DID $9.99 one-time
  through HAHS Sovereign Infrastructure License $29,999 mo). Per-call USDC prices for individual operations are in
  the OpenAPI x-mpp-charge values, the HiveTrust agent card fee_schedule, hivetrust.json and hivelaw's
  hive-payments.json — recorded under metered_prices. The first DID is free and the provider advertises the first
  paid call free and every sixth paid call free ("BOGO") on presentation of an x-hive-did header.
